<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ComplianceOS — UI/UX Prototype</title>
<style>
  :root{
    --bg:#09090b; --bg2:#101012; --panel:#18181b; --panel2:#141416;
    --border:#27272a; --border2:#3f3f46; --text:#fafafa; --text2:#a1a1aa; --text3:#71717a; --text4:#52525b;
    --red:#7f1d1d; --red-bg:#1c0a0a; --red-tx:#fca5a5;
    --orange:#7c2d12; --orange-bg:#1c0f06; --orange-tx:#fdba74;
    --yellow:#713f12; --yellow-bg:#1c1206; --yellow-tx:#fde047;
    --green:#14532d; --green-bg:#0a1c0f; --green-tx:#86efac;
    --blue-accent:#1d4ed8; --emerald-accent:#047857; --rose-accent:#be123c; --zinc-accent:#3f3f46;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:14px; line-height:1.5; min-height:100vh;
  }
  .mono{font-family:"SF Mono",Consolas,Monaco,monospace;}
  .hidden{display:none !important;}
  button{font-family:inherit; cursor:pointer;}
  input,textarea,select{font-family:inherit; font-size:13px; color:var(--text);}
  ::placeholder{color:var(--text4);}

  /* layout */
  .center-screen{min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:64px 24px;}
  .max-w-2xl{max-width:640px; width:100%;}
  .max-w-7xl{max-width:1280px; margin:0 auto;}
  .grid-ind{display:grid; grid-template-columns:1fr; gap:16px; width:100%;}
  @media(min-width:640px){.grid-ind{grid-template-columns:1fr 1fr; gap:20px;}}

  .ind-card{text-align:left; padding:24px; border-radius:12px; border:1px solid var(--border2); background:var(--panel2); transition:filter .15s; color:var(--text);}
  .ind-card:hover{filter:brightness(1.25);}
  .ind-card.financial{border-color:#1d4ed8aa; background:#0c1a3e55;}
  .ind-card.insurance{border-color:#047857aa; background:#04231955;}
  .ind-card.healthcare{border-color:#be123caa; background:#2b0a1455;}
  .ind-card.corporate{border-color:#52525baa; background:#27272a55;}
  .ind-icon{font-size:30px; margin-bottom:12px;}
  .ind-name{font-size:16px; font-weight:600; margin-bottom:4px;}
  .ind-tag{font-size:12px; color:var(--text2); margin-bottom:12px;}
  .ind-reg{font-size:12px; color:var(--text3); font-family:monospace;}
  .ind-count{margin-top:16px; font-size:12px; color:var(--text3);}

  header.app-header{border-bottom:1px solid var(--border); padding:16px 32px;}
  .header-row{display:flex; align-items:center; justify-content:space-between; max-width:1280px; margin:0 auto;}
  .brand h1{font-size:22px; font-weight:700; letter-spacing:-0.02em;}
  .brand p{font-size:13px; color:var(--text3); margin-top:2px;}
  .header-actions{display:flex; align-items:center; gap:8px;}
  .btn{border:none; border-radius:6px; font-size:12px; font-weight:500; padding:7px 14px; cursor:pointer; transition:.15s;}
  .btn-primary{background:#f4f4f5; color:#18181b;}
  .btn-primary:hover{background:#fff;}
  .btn-primary:disabled{opacity:.5; cursor:default;}
  .btn-ghost{background:#27272a; border:1px solid #3f3f46; color:#d4d4d8;}
  .btn-ghost:hover{background:#3f3f46;}
  .btn-link{background:transparent; border:1px solid var(--border); color:var(--text3);}
  .btn-link:hover{background:var(--panel2);}

  .layout{max-width:1280px; margin:0 auto; padding:32px; display:grid; grid-template-columns:1fr; gap:24px;}
  @media(min-width:768px){.layout{grid-template-columns:260px 1fr; gap:32px; padding:32px;}}

  .sidebar-title{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--text3); margin-bottom:12px;}
  .nav-btn{display:block; width:100%; text-align:left; padding:10px 12px; border-radius:6px; border:1px solid transparent; background:transparent; color:var(--text); margin-bottom:2px;}
  .nav-btn:hover{background:var(--panel2);}
  .nav-btn.active{background:var(--panel); border-color:var(--border2);}
  .nav-btn .lbl{font-size:13px; font-weight:500; display:flex; align-items:center; gap:6px;}
  .nav-btn .desc{font-size:11px; color:var(--text3); margin-top:1px;}
  .pill-count{background:#ef4444; color:#fff; border-radius:999px; font-size:10px; padding:1px 6px;}

  .back-btn{display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--text3); background:none; border:none; margin-bottom:16px;}
  .back-btn:hover{color:var(--text2);}

  h2.modtitle{font-size:20px; font-weight:600; margin-bottom:8px;}
  p.modsub{font-size:13px; color:var(--text3); margin-bottom:24px;}

  .box{border:1px solid var(--border); border-radius:8px; padding:20px; margin-bottom:20px;}
  .box-title{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--text3); margin-bottom:14px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; color:var(--text3); margin-bottom:5px;}
  .field input, .field textarea, .field select{
    width:100%; padding:9px 11px; background:var(--panel); border:1px solid var(--border); border-radius:6px;
  }
  .field input:focus, .field textarea:focus, .field select:focus{outline:none; border-color:var(--border2);}
  textarea{resize:vertical; min-height:90px;}
  textarea.tall{min-height:150px;}
  .field-err{color:#f87171; font-size:11px; margin-top:4px;}

  .card{border:1px solid var(--border); border-radius:10px; padding:16px;}
  .stat-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-bottom:8px;}
  @media(min-width:768px){.stat-grid{grid-template-columns:repeat(4,1fr);}}
  .stat-num{font-size:26px; font-weight:700; font-family:monospace; margin-bottom:2px;}
  .stat-lbl{font-size:11px; color:var(--text3);}

  .mod-grid{display:grid; grid-template-columns:1fr; gap:12px;}

  .mod-card:hover .card{background:var(--panel2);}

  .mod-card .mc-desc{font-size:11px; color:var(--text3);}

  .badge.lg{font-size:13px; padding:5px 11px;}
  .badge.sm{font-size:10px; padding:2px 6px;}
  .badge.critical{background:var(--red-bg); color:var(--red-tx); border-color:var(--red);}
  .badge.high{background:var(--orange-bg); color:var(--orange-tx); border-color:var(--orange);}
  .badge.medium{background:var(--yellow-bg); color:var(--yellow-tx); border-color:var(--yellow);}
  .badge.low{background:var(--green-bg); color:var(--green-tx); border-color:var(--green);}
  .badge.neutral{background:#27272a; color:#d4d4d8; border-color:#3f3f46;}
  .badge.success{background:var(--green-bg); color:#4ade80; border-color:#166534;}

  .pill{display:inline-flex; align-items:center; gap:6px; padding:5px 11px; border-radius:999px; font-size:11px; font-weight:500;}
  .pill.on{background:#14532d80; color:#4ade80; border:1px solid #166534;}
  .pill-dot{width:6px; height:6px; border-radius:999px; background:#4ade80;}

  .result-box{background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:16px; margin-top:12px;}
  .badge-row{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:10px;}
  .field-row{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:8px;}
  .sub-label{font-size:11px; color:var(--text3); margin-bottom:6px; text-transform:capitalize;}
  ul.bullets{list-style:none;}
  ul.bullets li{font-size:13px; color:#d4d4d8; display:flex; gap:8px; align-items:flex-start; margin-bottom:4px;}
  ul.bullets li .dot{margin-top:5px; width:5px; height:5px; border-radius:999px; background:#ca8a04; flex-shrink:0;}
  ul.bullets li.red .dot{background:#dc2626;}
  ul.bullets li.orange .dot{background:#ea580c;}
  .kv{font-size:13px; color:#d4d4d8; margin-bottom:6px;}
  .kv .k{color:var(--text3); text-transform:capitalize;}

  table.boxed{border:1px solid var(--border2); border-radius:6px; overflow:hidden;}
  thead tr{background:var(--panel); border-bottom:1px solid var(--border2);}
  th{text-align:left; padding:10px 14px; font-size:11px; color:var(--text3); font-weight:500;}
  td{padding:10px 14px; border-bottom:1px solid var(--border); font-size:12.5px;}
  tr:last-child td{border-bottom:none;}
  tr.hoverable:hover{background:var(--panel2);}
  .empty-row{text-align:center; padding:32px; color:var(--text4); border:1px dashed var(--border); border-radius:6px; font-size:13px;}

  .toast{margin-bottom:16px; padding:10px 16px; background:var(--green-bg); border:1px solid #166534; border-radius:6px; font-size:13px; color:#4ade80;}
  .demo-banner{background:#1e293b; border:1px solid #334155; color:#93c5fd; font-size:12px; padding:8px 16px; text-align:center;}
  a.lnk{color:#93c5fd; text-decoration:underline; cursor:pointer;}
  .kanban{display:grid; grid-template-columns:1fr; gap:12px;}
  @media(min-width:768px){.kanban{grid-template-columns:repeat(4,1fr);}}
  .kanban-col-title{font-size:11px; text-transform:uppercase; color:var(--text3); margin-bottom:8px; letter-spacing:.05em;}
  .kanban-card{border:1px solid var(--border); border-radius:6px; padding:10px; margin-bottom:8px; font-size:12px; background:var(--panel);}

  .barchart{display:flex; align-items:flex-end; gap:10px; height:120px; padding-top:8px;}
  .bar-wrap{flex:1; display:flex; flex-direction:column; align-items:center; height:100%; justify-content:flex-end;}
  .bar{width:100%; border-radius:4px 4px 0 0;}
  .bar-lbl{font-size:11px; color:var(--text3); margin-top:6px;}
  .bar-val{font-size:11px; color:var(--text2); margin-bottom:4px; font-family:monospace;}
  .hash-chain{font-family:monospace; font-size:11px; color:var(--text3);}
  .chk{color:#4ade80;}
</style>
</head>

const TICKETS = {}; // per industry, seeded lazily

function fmtDate(d){ return d.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'}) }
function daysAgo(n){ const d = new Date(); d.setDate(d.getDate()-n); return d }
function uid(){ return Math.random().toString(36).slice(2,9) }

// ── seed per-industry mock data so screens feel alive on first visit ────
function seedTickets(ind){
  if (TICKETS[ind]) return TICKETS[ind]
  const cats = INDUSTRY_CONFIGS[ind].ticketCategories
  TICKETS[ind] = [
    { id: uid(), title: cats[0], priority: 'critical', status: 'open', created_at: daysAgo(1) },
    { id: uid(), title: cats[2], priority: 'high', status: 'in_progress', created_at: daysAgo(3) },
    { id: uid(), title: cats[1], priority: 'medium', status: 'in_progress', created_at: daysAgo(6) },
    { id: uid(), title: cats[4] || cats[0], priority: 'low', status: 'resolved', created_at: daysAgo(11) },
  ]
  return TICKETS[ind]
}

function seedAlerts(ind){
  const base = {
    financial: [
      ['UIF SAR filing due', 'critical', 2],
      ['BCRA Communication “A” 7XXX implementation deadline', 'high', 9],
      ['Quarterly AML training certification expiring', 'medium', 21],
    ],
    insurance: [
      ['SSN solvency ratio filing due', 'critical', 3],
      ['SUSEP market-conduct report deadline', 'high', 12],
      ['Reserve adequacy review due', 'medium', 18],
    ],
    healthcare: [
      ['ANVISA expedited safety report — fatal outcome', 'critical', 1],
      ['COFEPRIS device registration renewal', 'high', 14],
      ['LGPD data subject request SLA', 'medium', 5],
    ],
    corporate: [
      ['LGPD breach notification window closing', 'critical', 2],
      ['Annual environmental disclosure due', 'high', 16],
      ['Labor compliance audit follow-up', 'medium', 24],
    ],
  }
  return base[ind].map(([title, sev, days]) => ({ title, severity: sev, due: daysAgo(-days) }))
}

function seedAudit(ind){
  const actions = ['copilot.ask', 'kyc.screen_customer', 'monitoring.analyze_transactions', 'monitoring.detect_drift', 'governance.audit_response', 'evidence.extract']
  let prevHash = '0'.repeat(64)
  const rows = []
  for (let i = 0; i < 8; i++){
    const h = Array.from({length:64}, () => '0123456789abcdef'[Math.floor(Math.random()*16)]).join('')
    rows.push({ ts: daysAgo(8-i), action: actions[i % actions.length], hash: h, prev: prevHash })
    prevHash = h
  }
  return rows.reverse()
}

function seedScores(ind){
  const entities = {
    financial: ['Polkorp Pay SA', 'NeoBank LATAM', 'PSP Frontera SRL'],
    insurance: ['Seguros del Sur SA', 'ReAndes Re', 'Broker Continental'],
    healthcare: ['LabClinica Andina', 'PharmaLatam SA', 'BioSalud Mexico'],
    corporate: ['Holding Austral SA', 'Comercial Pacifico', 'Grupo Industrial MX'],
  }
  return entities[ind].map((name, i) => ({ name, score: 92 - i*14, trend: i === 0 ? 'up' : i === 1 ? 'flat' : 'down' }))
}

function mockKycResult(parsed){
  const pep = !!parsed.pep_flag
  const highRisk = pep || (parsed.monthly_income_usd && parsed.monthly_income_usd > 50000) || /import|export|crypto|cash/i.test(parsed.occupation || '')
  const flags = []
  if (pep) flags.push('Politically exposed person — enhanced due diligence required')
  if (/import|export/i.test(parsed.occupation || '')) flags.push('Trade-based business — elevated trade-based ML exposure')
  if (parsed.country && !['AR','BR','MX','CL','CO','PE','UY'].includes(parsed.country)) flags.push('Country outside standard LATAM operating footprint — verify residency')
  return {
    success: true,
    risk_level: pep ? 'CRITICAL' : highRisk ? 'HIGH' : 'MEDIUM',
    ai_risk_score: pep ? 88 : highRisk ? 64 : 31,
    requires_human_review: pep || highRisk,
    red_flags: flags,
  }
}

const AML_INDUSTRY_TEXT = {
  financial: { typologies: ['structuring', 'layering', 'mule_network_indicators'], action_field: 'merchant_account_action', filing_field: 'rof_sar_required' },
  insurance: { typologies: ['claims_fraud', 'reserve_drift'], action_field: null, filing_field: 'regulatory_filing_required' },
  corporate: { typologies: ['policy_violation', 'data_privacy_gap'], action_field: null, filing_field: 'regulatory_filing_required' },
}

function mockMonitoringResult(ind, parsed){
  if (ind === 'healthcare') {
    const deaths = Number(parsed.death_count || parsed.fatal_outcome_count || 0)
    const serious = Number(parsed.serious_event_count || parsed.serious_adverse_event_count || 0)
    const ruleFlags = []
    let ruleScore = 0
    if (deaths >= 1) { ruleFlags.push('fatal_outcome_reported'); ruleScore += 50 }
    if (serious >= 3) { ruleFlags.push('serious_event_cluster'); ruleScore += 35 }
    if (parsed.device_malfunction_flag) { ruleFlags.push('device_malfunction'); ruleScore += 25 }
    if (parsed.counterfeit_suspected || parsed.diversion_suspected) { ruleFlags.push('counterfeit_or_diversion_suspected'); ruleScore += 30 }
    ruleScore = Math.min(ruleScore, 100)
    const aiScore = Math.min(100, ruleScore + 8)
    const finalScore = Math.round(0.4*ruleScore + 0.6*aiScore)
    const seriousness = deaths >= 1 ? 'FATAL' : serious >= 3 ? 'SERIOUS' : 'NON_SERIOUS'
    return {
      success: true, anomaly_score: finalScore, rule_flags: ruleFlags,
      investigation_priority: finalScore >= 70 ? 'CRITICAL' : finalScore >= 40 ? 'HIGH' : finalScore >= 20 ? 'MEDIUM' : 'LOW',
      analysis: {
        signal_type: ruleFlags.length ? ruleFlags.map(f => f.replace('fatal_outcome_reported','adverse_event_cluster').replace('serious_event_cluster','adverse_event_cluster').replace('device_malfunction','device_malfunction').replace('counterfeit_or_diversion_suspected','counterfeit_suspected')) : ['adverse_event_cluster'],
        seriousness,
        evidence: [`${serious} serious adverse events recorded in current reporting period`, deaths >= 1 ? `${deaths} fatal outcome(s) reported` : 'No fatal outcomes reported'],
        regulatory_action: deaths >= 1 ? 'REPORT_ANVISA' : serious >= 3 ? 'REPORT_ANMAT' : 'MONITOR',
        expedited_report_required: deaths >= 1,
        evidence_to_preserve: ['case_narratives', 'lab_results', 'device_logs'],
        recommended_next_steps: deaths >= 1
          ? ['File expedited ANVISA/ANMAT report within regulatory window', 'Preserve case files and chain of custody', 'Notify pharmacovigilance qualified person']
          : ['Continue routine signal monitoring', 'Cross-check against device complaint database'],
      },
      model_used: 'nvidia/llama-3.3-nemotron-super-49b-v1', latency_ms: 2940,
    }
  }
  const count = Number(parsed.transaction_count || parsed.count || 0)
  const total = Number(parsed.total_amount || parsed.total || 0)
  const maxSingle = Number(parsed.max_single_amount || 0)
  const ruleFlags = []
  let ruleScore = 0
  if (count >= 5 || total >= 15000) { ruleFlags.push('velocity_threshold'); ruleScore += 30 }
  if (maxSingle >= 10000) { ruleFlags.push('ctr_threshold'); ruleScore += 30 }
  if (parsed.high_risk_geography_flag || parsed.high_risk_countries) { ruleFlags.push('high_risk_geography'); ruleScore += 25 }
  ruleScore = Math.min(ruleScore, 100)
  const aiScore = Math.min(100, ruleScore + 12)
  const finalScore = Math.round(0.4*ruleScore + 0.6*aiScore)
  const meta = AML_INDUSTRY_TEXT[ind] || AML_INDUSTRY_TEXT.financial
  const analysis = {
    patterns_detected: ruleFlags.length ? meta.typologies.slice(0, ruleFlags.length) : [],
    likely_typologies: ind === 'financial' ? (ruleFlags.length ? ['structuring', 'smurfing'] : []) : undefined,
    evidence: [`${count} transactions totaling $${total.toLocaleString()} in the last 30 days`, maxSingle ? `Largest single transaction: $${maxSingle.toLocaleString()}` : null].filter(Boolean),
    investigation_priority: finalScore >= 70 ? 'CRITICAL' : finalScore >= 40 ? 'HIGH' : finalScore >= 20 ? 'MEDIUM' : 'LOW',
    evidence_to_preserve: ['transaction_logs', 'counterparty_kyc', 'device_fingerprints'],
    recommended_next_steps: finalScore >= 40
      ? ['Escalate to AML investigation queue', 'Freeze or restrict account pending review', 'Prepare SAR/ROS filing draft']
      : ['Continue automated monitoring', 'No immediate action required'],
  }
  if (meta.action_field) analysis[meta.action_field] = finalScore >= 70 ? 'FREEZE' : finalScore >= 40 ? 'RESTRICT' : 'MONITOR'
  if (meta.filing_field) analysis[meta.filing_field] = finalScore >= 50
  return {
    success: true, anomaly_score: finalScore, rule_flags: ruleFlags,
    investigation_priority: analysis.investigation_priority,
    analysis, model_used: 'nvidia/llama-3.3-nemotron-super-49b-v1', latency_ms: 3100,
  }
}

function mockDriftResult(ind, policy, behavior){
  const total = Number(behavior.transactions_over_threshold || 0)
  const compliant = Number(behavior.ctr_filed_count ?? behavior.edd_reviews_completed ?? 0)
  const rate = total > 0 ? 1 - (compliant/total) : 0
  const detected = rate > 0.15
  const ctx = INDUSTRY_CONFIGS[ind].regulators
  return {
    success: true,
    drift_detected: detected,
    drift_severity: rate > 0.5 ? 'CRITICAL' : rate > 0.3 ? 'HIGH' : rate > 0.15 ? 'MEDIUM' : 'LOW',
    policy_violation_rate: Math.round(rate*100)/100,
    affected_operations_count: Math.max(0, total - compliant),
    regulatory_exposure: detected ? [`Potential non-compliance under ${ctx}`] : [],
    root_cause_hypotheses: detected ? ['Manual review backlog', 'Control automation gap between systems', 'Staff training gap on updated threshold'] : [],
    immediate_actions: detected ? ['Escalate backlog to compliance ops', 'Notify control owner', 'Freeze affected workflow pending review'] : ['No immediate action — within tolerance'],
    remediation_plan: detected ? ['Automate the missing control step', 'Add real-time alerting on threshold breach', 'Re-train staff on updated policy'] : [],
  }
}

function badgeForScore(score){
  if (score >= 70) return 'critical'
  if (score >= 40) return 'high'
  return 'low'
}
function badgeForLevel(level){
  const m = {CRITICAL:'critical', HIGH:'high', MEDIUM:'medium', LOW:'low', FATAL:'critical', SERIOUS:'high', NON_SERIOUS:'low'}
  return m[(level||'').toUpperCase()] || 'neutral'
}

function renderAnalysisFields(analysis){
  let out = ''
  for (const [key, val] of Object.entries(analysis || {})){
    if (val === undefined || val === null) continue
    const label = key.replace(/_/g,' ')
    if (Array.isArray(val) && val.length){
      out += `<div style="margin-bottom:10px;"><div class="sub-label">${label}</div><ul class="bullets">${val.map(v=>`<li class="orange"><span class="dot"></span>${typeof v==='string'?v:JSON.stringify(v)}</li>`).join('')}</ul></div>`
    } else if (typeof val === 'string' && val){
      out += `<div class="kv"><span class="k">${label}:</span> ${val}</div>`
    } else if (typeof val === 'boolean'){
      out += `<div class="kv"><span class="k">${label}:</span> ${val?'Yes':'No'}</div>`
    }
  }
  return out
}

// ── handlers ─────────────────────────────────────────────────────────────
function selectIndustry(id){ localStorage.setItem('cosp_industry', id); S.industry = id; S.active = 'home'; render() }
function changeIndustry(){ localStorage.removeItem('cosp_industry'); S.industry = null; render() }
function setActive(id){ S.active = id; S.sidebarOpen = false; render() }
function toast(msg){ S.toast = msg; render(); setTimeout(()=>{ S.toast = null; render() }, 2500) }

function attachHandlers(){ /* all events are inline onclick; nothing to attach */ }

function askCopilot(){
  S.question = document.getElementById('qInput').value
  if (!S.question.trim()) return
  S.copilotLoading = true; render()
  setTimeout(() => {
    S.copilotResult = mockCopilotAnswer(S.question, S.industry)
    S.copilotLoading = false
    render()
  }, 700)
}

function screenCustomer(){
  const raw = document.getElementById('kycInput').value
  S.kycJson = raw
  try {
    const parsed = JSON.parse(raw)
    S.kycResult = mockKycResult(parsed)
  } catch(e) { toast('Invalid JSON: ' + e.message); return }
  render()
}

function checkSanctions(){
  S.sanctionName = document.getElementById('sName').value
  S.sanctionDocId = document.getElementById('sDoc').value
  S.sanctionCountry = document.getElementById('sCountry').value
  if (!S.sanctionName.trim()) return
  S.sanctionResult = {
    success: true, name_searched: S.sanctionName, lists_checked: ['OFAC SDN', 'UN Consolidated', 'UIF Argentina', 'EU Sanctions'],
    matches_found: /vladimir|sanction|test-match/i.test(S.sanctionName) ? 1 : 0,
    match_confidence: /vladimir|sanction|test-match/i.test(S.sanctionName) ? 0.92 : 0.0,
  }
  render()
}

function analyzeTransactions(){
  const raw = document.getElementById('monInput').value
  S.monTxJson = raw
  let parsed
  try { parsed = JSON.parse(raw) } catch(e) { toast('Invalid JSON: ' + e.message); return }
  S.monTxResult = mockMonitoringResult(S.industry, parsed)
  render()
}

function detectDrift(){
  S.driftPolicy = document.getElementById('driftPolicy').value
  const raw = document.getElementById('driftBehavior').value
  S.driftBehaviorJson = raw
  let parsed
  try { parsed = JSON.parse(raw) } catch(e) { toast('Invalid JSON: ' + e.message); return }
  if (!S.driftPolicy.trim()) return
  S.driftResult = mockDriftResult(S.industry, S.driftPolicy, parsed)
  render()
}

function parseRegulation(){
  S.regText = document.getElementById('regInput').value
  const result = mockRegulatoryParse(S.industry, S.regText)
  if (!result) { toast('Enter regulation text first'); return }
  S.regResult = result
  render()
}

function createWorkflow(){
  S.workflowTitle = document.getElementById('wfTitle').value
  S.workflowTrigger = document.getElementById('wfTrigger').value
  S.workflowSeverity = document.getElementById('wfSeverity').value
  if (!S.workflowTitle.trim() || !S.workflowTrigger.trim()) return
  S.workflowResult = { id: 'WF-' + uid().toUpperCase(), title: S.workflowTitle, trigger: S.workflowTrigger, severity: S.workflowSeverity, status: 'open', created_at: new Date().toISOString() }
  render()
}

function simulateMarketEntry(){
  S.simBusinessModel = document.getElementById('simModel').value
  S.simCountries = document.getElementById('simCountries').value
  if (!S.simBusinessModel.trim()) return
  const countries = S.simCountries.split(',').map(s=>s.trim()).filter(Boolean)
  S.simResult = {
    business_model: S.simBusinessModel,
    countries_evaluated: countries,
    go_no_go: countries.length > 2 ? 'CONDITIONAL_GO' : 'GO',
    estimated_compliance_cost_y1_usd: `$${(120000 + countries.length*45000).toLocaleString()}`,
    timeline_months: 4 + countries.length*2,
    blockers: countries.includes('BR') ? ['BACEN local incorporation requirement'] : [],
  }
  render()
}

function createTicket(){
  const cat = document.getElementById('ticketCat').value
  const desc = document.getElementById('ticketDesc').value
  const prio = document.getElementById('ticketPrio').value
  if (!cat) { toast('Select a category first'); return }
  seedTickets(S.industry).unshift({ id: uid(), title: cat, priority: prio, status: 'open', created_at: new Date() })
  toast('Ticket created')
}

function updateTicketStatus(id, status){
  const t = seedTickets(S.industry).find(t => t.id === id)
  if (t) t.status = status
  render()
}

function askTicketAI(){
  S.ticketChatQ = document.getElementById('ticketChatQ').value
  if (!S.ticketChatQ.trim()) return
  S.ticketChatResult = mockCopilotAnswer(S.ticketChatQ, S.industry).answer
  render()
}

function extractEvidence(){
  S.evidenceResult = {
    id: 'DOC-' + uid().toUpperCase(), pages: 4 + Math.floor(Math.random()*8),
    hash: Array.from({length:64}, () => '0123456789abcdef'[Math.floor(Math.random()*16)]).join(''),
    fields: ['issuing_authority', 'effective_date', 'obligation_summary', 'penalty_schedule'],
  }
  render()
}

function runSearch(){
  S.searchQuery = document.getElementById('searchInput').value
  if (!S.searchQuery.trim()) return
  S.searchResult = [
    { title: `${INDUSTRY_CONFIGS[S.industry].regulators.split(' · ')[0]} — relevant communication`, snippet: 'Matched via semantic similarity to query', score: 91 },
    { title: 'Internal control: ' + S.searchQuery, snippet: 'Matched via keyword index', score: 74 },
  ]
  render()
}

render()
</script>
